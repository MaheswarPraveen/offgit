# offGIT Configuration File

llm_tool: claude
devlog_interval_seconds: 600
context_push_debounce_seconds: 120
diff_char_limit: 8000
default_repo_visibility: private
prompt_threshold:
  - 5
  - 15
  - 30
  - 60
notifications: native
watched_extensions:
  - .ino
  - .gd
  - .py
  - .ts
  - .cpp
  - .h
  - .js
  - .c
  - .hpp
  - .tscn
  - .md